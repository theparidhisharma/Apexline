services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    env_file: [.env]
  web:
    image: node:20-slim
    working_dir: /app
    volumes: ["./web:/app"]
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["5173:5173"]
    environment:
      - VITE_API=http://api:8000
